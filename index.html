<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="LamiaZone">
    <title>LamiaZone</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">

    <style>
        .message-screen {
            display: none;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #08080d;
            color: #ff477e;
            font-family: Arial, sans-serif;
        }

        .message-screen h1 {
            display: block;
            width: 100%;
            font-size: clamp(24px, 5vw, 42px);
            overflow-wrap: anywhere;
        }

        .message-screen p {
            display: block;
            width: 100%;
            margin-top: 16px;
            color: #a5a5b5;
            font-size: clamp(14px, 3vw, 18px);
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <!-- Original Welcome Popup -->
    <div id="welcomeOverlay" class="welcome-overlay">
        <div class="welcome-box">
            <div class="welcome-heart">♥</div>

            <h2>Good Luck, Lamia! ❤️</h2>
            <p>Are you ready? 👀</p>

            <button id="readyBtn" type="button">Ready ❤️</button>
        </div>
    </div>

    <!-- Message after clicking Ready -->

    <main id="messageScreen" class="message-screen">
        <h1>
            Nothing here for scammers. 🚫
        </h1>

        <p>
            This place has no room for people without integrity. 🖤
        </p>
    </main>


    <script>
        const VISITOR_LOG_URL =
            'https://script.google.com/macros/s/AKfycbwLTabN__CWkVDBhjDc9-WH4paBsyITqiilFhymtcnk_PBR5Z6141gLJDl_tU1V9ryR2Q/exec';

        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const readyBtn = document.getElementById('readyBtn');
        const messageScreen = document.getElementById('messageScreen');

        readyBtn.addEventListener('click', function () {
            // Hide the original welcome popup
            welcomeOverlay.style.display = 'none';

            // Show only the message
            messageScreen.style.display = 'flex';

            // Preserve the original owner detection
            const ownerMode =
                new URLSearchParams(window.location.search).get('owner') === '1';

            if (ownerMode) {
                localStorage.setItem('lamiaVisitorRole', 'OWNER');
            }

            const visitorRole =
                localStorage.getItem('lamiaVisitorRole') || 'USER';

            // Save visitor log to Google Sheets
            const visitorLog = new Image();

            visitorLog.src =
                VISITOR_LOG_URL +
                '?role=' + encodeURIComponent(visitorRole) +
                '&t=' + Date.now();
        });
    </script>

</body>

</html>
